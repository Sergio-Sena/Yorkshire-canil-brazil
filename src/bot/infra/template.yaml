AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Yorkshire Canil Brazil — Bot IA WhatsApp (API Gateway + Lambda + SQS + DynamoDB + SNS)

# ── Parâmetros ────────────────────────────────────────────────────────────────
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]

  WhatsappToken:
    Type: String
    NoEcho: true

  WhatsappPhoneId:
    Type: String

  WhatsappAppSecret:
    Type: String
    NoEcho: true

  WebhookVerifyToken:
    Type: String
    NoEcho: true

  BedrockModelId:
    Type: String
    Default: anthropic.claude-sonnet-4-5

  GuardrailId:
    Type: String
    Default: ""

  GuardrailVersion:
    Type: String
    Default: DRAFT

  # Thiago — notificado diretamente no WhatsApp (sem SNS)
  ThiagoPhone:
    Type: String
    Description: WhatsApp do Thiago para notificações de lead (ex 5511977118201)

  # Sergio — alertas técnicos (DLQ, erros críticos)
  SergioEmail:
    Type: String
    Description: E-mail do Sergio para alertas técnicos (backup passivo)

  SergioPhone:
    Type: String
    Description: WhatsApp do Sergio para alertas técnicos ativos (ex 5511999999999)

# ── Tags globais (Cost Explorer por projeto) ──────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]          # Graviton2 — 20% mais barato que x86
    MemorySize: 256
    Layers:
      - !Ref DependenciesLayer
    Tags:
      Project: yorkshire-bot
      Client: yorkshire-canil-brazil
      Env: !Ref Environment
      ManagedBy: ss-technologies
    Environment:
      Variables:
        AWS_REGION_NAME:      !Ref AWS::Region
        ENVIRONMENT:          !Ref Environment
        DYNAMODB_TABLE:       !Ref ConversationsTable
        TECH_SNS_TOPIC_ARN:   !Ref TechAlertTopic
        SQS_QUEUE_URL:        !Ref MessageQueue
        BEDROCK_MODEL_ID:     !Ref BedrockModelId
        GUARDRAIL_ID:         !Ref GuardrailId
        GUARDRAIL_VERSION:    !Ref GuardrailVersion
        WHATSAPP_TOKEN:       !Ref WhatsappToken
        WHATSAPP_PHONE_ID:    !Ref WhatsappPhoneId
        WHATSAPP_APP_SECRET:  !Ref WhatsappAppSecret
        WEBHOOK_VERIFY_TOKEN: !Ref WebhookVerifyToken
        THIAGO_PHONE:         !Ref ThiagoPhone
        SERGIO_PHONE:         !Ref SergioPhone
        PROMPT_BUCKET:        !Ref PromptBucket
        PROMPT_KEY_ACTIVE:    active/prompt.txt
        PROMPT_KEY_BACKUP:    backup/prompt.txt

# ── Resources ─────────────────────────────────────────────────────────────────
Resources:

  # ── Layer de dependências Python ──────────────────────────────────────────
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub yorkshire-bot-deps-${Environment}
      ContentUri: ../lambda/
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.12

  # ── Lambda Webhook (leve — só valida + enfileira) ─────────────────────────
  WebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub yorkshire-bot-webhook-${Environment}
      CodeUri: ../lambda/
      Handler: handler.lambda_handler
      Timeout: 10
      Description: Valida assinatura Meta e enfileira no SQS
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MessageQueue.QueueName
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
      Events:
        WebhookGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: GET
            Path: /webhook
        WebhookPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: POST
            Path: /webhook

  # ── Lambda Processor (pesado — Bedrock + DynamoDB + WhatsApp) ────────────
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub yorkshire-bot-processor-${Environment}
      CodeUri: ../lambda/
      Handler: processor.lambda_handler
      Timeout: 60
      Description: Processa mensagens do SQS — Bedrock + DynamoDB + WhatsApp
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
                - bedrock:ApplyGuardrail
              Resource: "*"
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/yorkshire-bot/prompt/*
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - !Sub arn:aws:s3:::${PromptBucket}/active/*
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt MessageQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ── Lambda DLQ Consumer — fallback para cliente que ficaria no vazio ──────
  DLQConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub yorkshire-bot-dlq-consumer-${Environment}
      CodeUri: ../lambda/
      Handler: dlq_consumer.lambda_handler
      Timeout: 30
      Description: Consome DLQ — avisa cliente que houve instabilidade e notifica Sergio
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt TechAlertTopic.TopicName
      Events:
        DLQTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt DeadLetterQueue.Arn
            BatchSize: 1

  # ── Lambda Morning Dispatcher — notifica Thiago com leads noturnos às 8h ─
  MorningDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub yorkshire-bot-morning-dispatcher-${Environment}
      CodeUri: ../lambda/
      Handler: morning_dispatcher.lambda_handler
      Timeout: 30
      Description: Dispara às 8h BRT notificando Thiago sobre leads quentes da madrugada
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
      Events:
        MorningSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 11 * * ? *)   # 8h BRT = 11h UTC
            Description: Dispara todo dia às 8h (America/Sao_Paulo)
            Enabled: true

  # ── Lambda Notifier (alertas técnicos → WhatsApp Sergio) ─────────────────
  NotifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub yorkshire-bot-notifier-${Environment}
      CodeUri: ../lambda/
      Handler: notifier.lambda_handler
      Timeout: 15
      Description: Recebe alarmes CloudWatch via SNS e avisa Sergio no WhatsApp

  NotifierSNSPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref NotifierFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref TechAlertTopic

  # ── API Gateway HTTP API ───────────────────────────────────────────────────
  WebhookApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub yorkshire-bot-api-${Environment}
      StageName: !Ref Environment
      Description: Webhook Meta WhatsApp Business API
      CorsConfiguration:
        AllowOrigins:
          - "https://sstrafegopago.sstechnologies-cloud.com"
          - "https://yorkshire.sstechnologies-cloud.com"
          - "http://localhost:8000"
        AllowHeaders:
          - "Content-Type"
          - "x-api-key"
        AllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "PATCH"
          - "OPTIONS"
      Tags:
        Project: yorkshire-bot
        Client: yorkshire-canil-brazil
        Env: !Ref Environment
        ManagedBy: ss-technologies

  # ── SQS FIFO — fila principal ─────────────────────────────────────────────
  MessageQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub yorkshire-bot-messages-${Environment}.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 90
      MessageRetentionPeriod: 3600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Project
          Value: yorkshire-bot
        - Key: Client
          Value: yorkshire-canil-brazil
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: ss-technologies

  # ── SQS FIFO — Dead Letter Queue ─────────────────────────────────────────
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub yorkshire-bot-dlq-${Environment}.fifo
      FifoQueue: true
      MessageRetentionPeriod: 86400
      Tags:
        - Key: Project
          Value: yorkshire-bot
        - Key: Client
          Value: yorkshire-canil-brazil
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: ss-technologies

  # ── DynamoDB — tabela única com GSI para follow-up ────────────────────────
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub yorkshire-bot-conversations-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: phone
          AttributeType: S
        - AttributeName: record_type
          AttributeType: S
        - AttributeName: followup_ts
          AttributeType: N
      KeySchema:
        - AttributeName: phone
          KeyType: HASH
        - AttributeName: record_type
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: followup-index
          KeySchema:
            - AttributeName: record_type
              KeyType: HASH
            - AttributeName: followup_ts
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: yorkshire-bot
        - Key: Client
          Value: yorkshire-canil-brazil
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: ss-technologies

  # ── SNS — alertas técnicos (Sergio: DLQ, erros críticos) ─────────────────
  TechAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub yorkshire-bot-tech-alerts-${Environment}
      Subscription:
        - Protocol: email
          Endpoint: !Ref SergioEmail
      Tags:
        - Key: Project
          Value: yorkshire-bot
        - Key: Client
          Value: yorkshire-canil-brazil
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: ss-technologies

  NotifierSNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref TechAlertTopic
      Protocol: lambda
      Endpoint: !GetAtt NotifierFunction.Arn

  # ── Lambda Prompt Manager — editor de prompt via SSM ───────────────────────
  PromptManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub yorkshire-bot-prompt-manager-${Environment}
      CodeUri: ../lambda/
      Handler: prompt_manager.lambda_handler
      Timeout: 15
      Description: CRUD do system prompt via SSM — GET/PUT/rollback com validação
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:PutParameter
              Resource:
                - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/yorkshire-bot/prompt/*
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucketVersions
                - s3:GetObjectVersion
              Resource:
                - !Sub arn:aws:s3:::${PromptBucket}
                - !Sub arn:aws:s3:::${PromptBucket}/*
      Events:
        PromptGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: GET
            Path: /prompt
        PromptPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: PUT
            Path: /prompt
        PromptRollback:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: POST
            Path: /prompt/rollback

  # ── Lambda Conversations Manager — painel de conversas do Sergio ──────────
  ConversationsManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub yorkshire-bot-conversations-manager-${Environment}
      CodeUri: ../lambda/
      Handler: conversations_manager.lambda_handler
      Timeout: 15
      Description: Lista conversas, histórico, takeover e release para o painel do Sergio
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationsTable
      Events:
        ConvList:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: GET
            Path: /conversations
        ConvGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: GET
            Path: /conversations/{phone}
        ConvTakeover:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: POST
            Path: /conversations/{phone}/takeover
        ConvRelease:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: POST
            Path: /conversations/{phone}/release
        ConvStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: PATCH
            Path: /conversations/{phone}/status
        ConvSend:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: POST
            Path: /conversations/{phone}/send

  # ── Lambda Cost Explorer — custo mensal acumulado do bot ──────────────────
  CostExplorerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub yorkshire-bot-cost-${Environment}
      CodeUri: ../lambda/
      Handler: cost_explorer.lambda_handler
      Timeout: 15
      Description: Retorna custo mensal acumulado do bot via Cost Explorer (tag Project=yorkshire-bot)
      Policies:
        - Statement:
            - Effect: Allow
              Action: ce:GetCostAndUsage
              Resource: "*"
      Events:
        CostApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref WebhookApi
            Method: GET
            Path: /bot-cost

  # ── S3 Bucket — armazenamento do prompt com versionamento ─────────────────
  PromptBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub yorkshire-bot-prompts-${Environment}-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: archive-old-versions
            Status: Enabled
            NoncurrentVersionTransitions:
              - TransitionInDays: 30
                StorageClass: GLACIER_IR
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: yorkshire-bot
        - Key: Client
          Value: yorkshire-canil-brazil
        - Key: Env
          Value: !Ref Environment
        - Key: ManagedBy
          Value: ss-technologies

  # ── CloudWatch Alarm — DLQ com mensagem = problema crítico ───────────────
  DLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub yorkshire-bot-dlq-alarm-${Environment}
      AlarmDescription: Mensagem na DLQ — processamento falhou 3 vezes
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref TechAlertTopic    # → SNS → Lambda Notifier → WhatsApp Sergio
      TreatMissingData: notBreaching

# ── Outputs ───────────────────────────────────────────────────────────────────
Outputs:
  WebhookUrl:
    Description: URL para configurar no Meta WhatsApp Business API
    Value: !Sub https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/webhook

  WebhookFunctionArn:
    Value: !GetAtt WebhookFunction.Arn

  ProcessorFunctionArn:
    Value: !GetAtt ProcessorFunction.Arn

  DLQConsumerFunctionArn:
    Value: !GetAtt DLQConsumerFunction.Arn

  MorningDispatcherFunctionArn:
    Value: !GetAtt MorningDispatcherFunction.Arn

  NotifierFunctionArn:
    Value: !GetAtt NotifierFunction.Arn

  SQSQueueUrl:
    Value: !Ref MessageQueue

  DLQUrl:
    Value: !Ref DeadLetterQueue

  DynamoDBTable:
    Value: !Ref ConversationsTable

  TechSNSTopicArn:
    Description: SNS alertas técnicos — Sergio
    Value: !Ref TechAlertTopic

  BotCostApiUrl:
    Description: Endpoint custo mensal do bot (usar no painel-gestor)
    Value: !Sub https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/bot-cost

  PromptApiUrl:
    Description: Endpoint editor de prompt (GET/PUT/rollback)
    Value: !Sub https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/prompt

  PromptManagerFunctionArn:
    Value: !GetAtt PromptManagerFunction.Arn

  PromptBucketName:
    Description: Bucket S3 para armazenamento do prompt com versionamento
    Value: !Ref PromptBucket

  PromptBucketArn:
    Description: ARN do bucket de prompts
    Value: !GetAtt PromptBucket.Arn

  ConversationsApiUrl:
    Description: Endpoint gerenciamento de conversas (painel Sergio)
    Value: !Sub https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/conversations
